# Fast required gate (THIN-C2). Budget: required CI <= 20 min on push.
# Slow suites (browser/python/SC-10 store/sampled tests) live in nightly.yml, non-blocking.
# Hosted-runner-safe subset of `pnpm verify`.
# Full `pnpm verify` additionally runs local model/voice/godot/asset artifact
# validations that need local caches unavailable on GitHub-hosted runners.
# Run the full gate locally or on a self-hosted runner when those caches exist.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Thinning gate diffs against the push base / PR base.
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Thinning policy
        # Push to main: checkout moves origin/main to the pushed sha, so a bare
        # merge-base check would compare HEAD with itself (zero diff, always PASS).
        # Pass the pre-push sha explicitly (exact, no merge-base narrowing, so a
        # force-push is judged B->C not ancestor->C); pull_request diffs against
        # the base branch. An all-zero `before` (new branch) resolves the base as
        # merge-base(HEAD, origin/<default branch>) after fetching it; a failed
        # fetch or merge-base fails closed (never narrowed to HEAD~1).
        # fetch-depth: 0 above (full history) so the merge-base is resolvable.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec tsx tools/thinning/check-thinning.ts --base "origin/${{ github.base_ref }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              git fetch -q origin "$DEFAULT_BRANCH" || { echo "thinning: fetch origin/$DEFAULT_BRANCH failed" >&2; exit 1; }
              BASE="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")" || { echo "thinning: merge-base HEAD origin/$DEFAULT_BRANCH failed" >&2; exit 1; }
              [ -n "$BASE" ] || { echo "thinning: empty merge-base; refusing to narrow to HEAD~1" >&2; exit 1; }
              pnpm exec tsx tools/thinning/check-thinning.ts --base "$BASE"
            else
              pnpm exec tsx tools/thinning/check-thinning.ts --base "$BEFORE" --exact-base
            fi
          fi

      - name: Security licenses
        run: pnpm security:licenses

      - name: Bootstrap workspace builds (cold-safe exports)
        run: pnpm packages:build

      - name: Architecture rules
        run: pnpm architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Security audit policy
        run: pnpm security:audit-policy
