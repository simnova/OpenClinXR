# Hosted-runner-safe subset of `pnpm verify`.
# Full `pnpm verify` additionally runs local model/voice/godot/asset artifact
# validations that need local caches unavailable on GitHub-hosted runners.
# Run the full gate locally or on a self-hosted runner when those caches exist.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historical negative-control assets require history while old blobs stay on demand.
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-v2.9.14-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            turbo-v2.9.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap workspace builds (cold-safe exports)
        run: pnpm packages:build

      - name: Architecture rules
        run: pnpm architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Security audit policy
        run: pnpm security:audit-policy

      - name: Security licenses
        run: pnpm security:licenses
