# Hosted-runner-safe subset of `pnpm verify`.
# Full `pnpm verify` additionally runs local model/voice/godot/asset artifact
# validations that need local caches unavailable on GitHub-hosted runners.
# Run the full gate locally or on a self-hosted runner when those caches exist.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/mise.toml
      # `mise exec` installs missing mise.toml tools through the GitHub API; unauthenticated it hit the
      # rate limit: run 44133928084 attempts 1+2, "Failed to install aqua:pnpm/pnpm@11.18.0: HTTP status
      # client error (403 Forbidden)" (mise 2026.7.3). Read-only token; permissions stay contents: read.
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historical negative-control assets require history while old blobs stay on demand.
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-v2.9.14-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            turbo-v2.9.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install vulture with mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # mise binary pin: the local mise version that ran the cruft gate, measured 2026-11-16 (`mise --version`).
          version: 2026.7.3
          install_args: python@3.13 pipx:vulture
          add_shims_to_path: false
          env: false
          export_path: false

      - name: Confirm mise resolves vulture
        run: command -v mise && mise which vulture && vulture --version || mise exec pipx:vulture@2.14 -- vulture --version

      # uv the way the local machine has it: a pip package inside mise's python@3.13, whose bin
      # `mise exec` puts on PATH (mise.toml declares python, not uv). Version = local `uv --version`.
      - name: Install uv into mise python
        run: mise exec -- python -m pip install --disable-pip-version-check uv==0.12.3 numpy==2.5.1

      - name: Confirm mise resolves uv
        run: command -v mise && mise exec -- uv --version

      - name: Confirm setup-node and pnpm remain authoritative
        run: |
          node --version
          pnpm --version
          command -v node pnpm

      - name: Install browser and media tools for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg zsh
          pnpm exec playwright install --with-deps chromium

      - name: Bootstrap workspace builds (cold-safe exports)
        run: pnpm packages:build

      - name: Architecture rules
        run: pnpm architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare SC-10 metadata store
        run: |
          SC10_DIR="$(mktemp -d "${RUNNER_TEMP}/sc10-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-XXXXXX")"
          pnpm exec tsx packages/openclinxr/stations/scene-closure-evidence/src/scene-closure-research/prepare-sc10-metadata-store.ts --output-dir "$SC10_DIR"
          echo "OPENCLINXR_SC_EVIDENCE_REGISTRY=$SC10_DIR/registry.json" >> "${GITHUB_ENV}"

      # 35 = prior value; run 44100121469 killed at 35m12s with >=61/82 serial-browser files unstarted; not a measured budget.
      - name: Test tools
        id: test-tools
        timeout-minutes: 35
        env:
          OPENCLINXR_TOOLS_TESTS_SKIP_ECG_ARCHIVE: "1"
          OPENCLINXR_REQUIRE_UV: "1"
          OPENCLINXR_STATION_SAMPLE: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '2' || '' }}
          OPENCLINXR_STATION_SAMPLE_SEED: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.sha || '' }}
        run: pnpm test:tools

      # Runs after a tools failure OR a tools timeout (a timed-out step has outcome failure, not skipped); skipped only when setup/build/typecheck failed so tools never ran.
      # 64 = 2 x 31m45s, measured local pnpm packages:test:affected with 13/170 cached, sampled n=2 (jobs/ci-sample-wire/push.log, 2026-11-17); local Mac, 13/170 cached; CI runner speed unmeasured.
      - name: Test packages
        timeout-minutes: 64
        if: ${{ !cancelled() && steps.test-tools.outcome != 'skipped' }}
        env:
          OPENCLINXR_TOOLS_TESTS_SKIP_ECG_ARCHIVE: "1"
          OPENCLINXR_REQUIRE_UV: "1"
          OPENCLINXR_STATION_SAMPLE: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '2' || '' }}
          OPENCLINXR_STATION_SAMPLE_SEED: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.sha || '' }}
        run: pnpm packages:test --continue

      - name: Security audit policy
        run: pnpm security:audit-policy

      - name: Security licenses
        run: pnpm security:licenses
