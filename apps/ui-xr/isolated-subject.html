<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClinXR Isolated Subject Lab</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #18211d;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Intentionally no HUD chrome — isolation is the product of this page. */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { bootIsolatedSubjectLab } from "@openclinxr/xr-scene";
      import {
        sampleHumanoidBlinkSchedule,
      } from "@openclinxr/xr-humanoid-animation";
      import { scenarioBank } from "@openclinxr/scenario-fixtures/scenario-bank";
      import { resolveRuntimeSlotAssignment } from "@openclinxr/xr-capture-evidence";
      import { applyCleanEncounterVisualReviewActorFraming } from "@openclinxr/xr-scene";
      import {
        applyStagedPatientRootTransform,
        defaultPatientActorPlacement,
        observeMountedSupportInstances,
        resolveRuntimeActorPlacement,
      } from "@openclinxr/xr-station-room";
      import {
        buildStationEnvironment,
        PATIENT_CHAIR_SEAT_HEIGHT_METERS,
      } from "@openclinxr/xr-station";
      import {
        DataTexture,
        EquirectangularReflectionMapping,
        Group,
        HalfFloatType,
        LinearFilter,
        LinearSRGBColorSpace,
        RGBAFormat,
      } from "three";
      import {
        applyStationInteriorLightingForEnvironment,
        configureStationRendererToneMapping,
        loadLightingRig,
        resolveLightingRigPublicPath,
      } from "./src/lighting-rig-runtime.js";
      async function resolveProductPatientStagingTransform(input) {
        const scenarioId = input.scenarioId
          ?? scenarioBank.find((scenario) => scenario.environment?.environmentId === input.environmentId)?.scenarioId;
        if (!scenarioId) throw new Error(`no shipped scenario stages in ${input.environmentId}`);
        const response = await fetch(
          `/xr-assets/generated/${scenarioId}/learner-runtime-bundle.v1.json`,
          { cache: "no-store" },
        );
        if (!response.ok) {
          throw new Error(`static learner runtime asset bundle unavailable for ${scenarioId}: ${response.status}`);
        }
        const bundle = await response.json();
        if (bundle.scenarioId !== scenarioId) {
          throw new Error(`static learner runtime asset bundle mismatch: expected ${scenarioId}, received ${bundle.scenarioId}`);
        }
        const effectiveEnvironmentId = bundle.sceneManifest.environmentId
          ?? scenarioBank.find((scenario) => scenario.scenarioId === scenarioId)?.environment?.environmentId;
        if (effectiveEnvironmentId !== input.environmentId) {
          throw new Error(
            `scenario ${scenarioId} stages in ${effectiveEnvironmentId ?? "an unknown environment"}, not ${input.environmentId}`,
          );
        }
        const actorId = resolveRuntimeSlotAssignment(bundle).patientActorId;
        const actor = bundle.actors.find((candidate) => candidate.actorId === actorId);
        if (!actor) throw new Error(`primary patient ${actorId} missing from ${scenarioId}`);
        const room = buildStationEnvironment({
          environmentId: input.environmentId,
          ...(bundle.sceneManifest.fixtureSlotPlacements
            ? { fixtureSlotPlacements: bundle.sceneManifest.fixtureSlotPlacements }
            : {}),
        });
        const mountedSupportInstanceIds = observeMountedSupportInstances(room).map(
          (support) => support.supportInstanceId,
        );
        const placement = resolveRuntimeActorPlacement({
          bundle,
          actorId,
          fallback: defaultPatientActorPlacement,
          mountedSupportInstanceIds,
          scenarioId,
          environmentId: input.environmentId,
          patientChairSeatHeightMeters: PATIENT_CHAIR_SEAT_HEIGHT_METERS,
        });
        const patient = new Group();
        applyStagedPatientRootTransform({
          patient,
          placement,
          patientActorId: actorId,
          applyActorFraming: (stagedActor, stagedActorId, placement) => applyCleanEncounterVisualReviewActorFraming({
            actor: stagedActor,
            actorId: stagedActorId,
            scenarioId,
            role: actor.role,
            posture: placement.posture,
            skipFraming: false,
          }),
        });
        return {
          actorId,
          matrix: patient.matrixWorld.toArray(),
          position: patient.position.toArray(),
          quaternion: patient.quaternion.toArray(),
          scale: patient.scale.toArray(),
          scenarioId,
          environmentId: input.environmentId,
          mountedSupportInstanceIds,
        };
      }
      window.__openClinXrProductLightingRigFns = {
        applyStationInteriorLightingForEnvironment,
        configureStationRendererToneMapping,
        loadLightingRig,
        resolveLightingRigPublicPath,
        resolveProductPatientStagingTransform,
      };
      // hair-groom-2 P1 (opt-in, harness-called after the lab settles): an equirect radiance map
      // (three convention, row 0 = bottom, raw linear RGBA half floats) as scene.environment and
      // optionally scene.background, then one re-render. Never called on the default path.
      window.__openClinXrApplyEquirectEnvironment = async ({ url, width, height, background }) => {
        const root = window.__openClinXrIsolatedSceneRoot;
        const scene = root?.parent;
        if (!scene || typeof window.__openClinXrIsolatedRenderFrame !== "function") {
          throw new Error("equirect environment: lab scene not ready");
        }
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`equirect environment: ${url} -> HTTP ${response.status}`);
        const data = new Uint16Array(await response.arrayBuffer());
        if (data.length !== width * height * 4) {
          throw new Error(`equirect environment: ${data.length} halves for ${width}x${height} RGBA`);
        }
        const texture = new DataTexture(data, width, height, RGBAFormat, HalfFloatType);
        texture.mapping = EquirectangularReflectionMapping;
        texture.colorSpace = LinearSRGBColorSpace;
        texture.magFilter = LinearFilter;
        texture.minFilter = LinearFilter;
        texture.needsUpdate = true;
        scene.environment = texture;
        if (background === true) scene.background = texture;
        window.__openClinXrIsolatedRenderFrame();
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        window.__openClinXrIsolatedRenderFrame();
        return { halves: data.length };
      };
      // hair-groom-2 P1 alpha-to-coverage probe (opt-in, harness-called after the lab settles): on fitted hair meshes
      // (/hair/i, the isFittedHairMeshName rule) set alphaToCoverage and alphaTest on the alpha-tested (non-blended)
      // materials; hideBlend hides the blended fringe meshes so the hair draws in one pass. Re-renders once.
      window.__openClinXrApplyHairMaterialProbe = async ({ alphaToCoverage, alphaTest, hideBlend }) => {
        const root = window.__openClinXrIsolatedSceneRoot;
        if (!root || typeof window.__openClinXrIsolatedRenderFrame !== "function") {
          throw new Error("hair material probe: lab scene not ready");
        }
        const touched = { masked: 0, hiddenBlend: 0 };
        root.traverse((o) => {
          if (!o.isMesh || !/hair/i.test(o.name || o.geometry?.name || "")) return;
          for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
            if (m.transparent) {
              if (hideBlend === true) { o.visible = false; touched.hiddenBlend += 1; }
              continue;
            }
            m.alphaToCoverage = alphaToCoverage === true;
            if (typeof alphaTest === "number") m.alphaTest = alphaTest;
            m.needsUpdate = true;
            touched.masked += 1;
          }
        });
        window.__openClinXrIsolatedRenderFrame();
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        window.__openClinXrIsolatedRenderFrame();
        const canvas = document.querySelector("canvas");
        const gl = canvas?.getContext("webgl2") ?? canvas?.getContext("webgl");
        touched.samples = gl ? gl.getParameter(gl.SAMPLES) : -1;
        return touched;
      };
      bootIsolatedSubjectLab();
      window.__openClinXrProductEyeMotionDriver = sampleHumanoidBlinkSchedule.applyIsolatedHumanoidEyeMotion;
      sampleHumanoidBlinkSchedule.bootIsolatedSubjectEyeMotion(window);
    </script>
  </body>
</html>
