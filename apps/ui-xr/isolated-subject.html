<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClinXR Isolated Subject Lab</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #18211d;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Intentionally no HUD chrome — isolation is the product of this page. */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { bootIsolatedSubjectLab } from "@openclinxr/xr-scene";
      import {
        applyStationInteriorLightingForEnvironment,
        configureStationRendererToneMapping,
        loadLightingRig,
        resolveLightingRigPublicPath,
      } from "./src/lighting-rig-runtime.js";

      // Product-lighting bridge (composition-root wiring; the former
      // apps/ui-xr/src/isolated-subject-product-lighting.ts module was removed
      // so apps/ui-xr stays at its frozen composition-root budget). The lab
      // lives in @openclinxr/xr-scene and cannot import from the app, so the
      // page stashes the PRODUCT functions on window for the lab to call. No
      // energy/intensity or colour-temperature math here — it all stays inside
      // lighting-rig-runtime.ts.
      async function loadProductRigCast(environmentId) {
        try {
          const response = await fetch(resolveLightingRigPublicPath(environmentId), { cache: "no-store" });
          if (!response.ok) return null;
          const json = await response.json();
          if (!Array.isArray(json.cast)) return null;
          const out = [];
          for (const entry of json.cast) {
            if (typeof entry.actorId !== "string") continue;
            const p = entry.position;
            if (!Array.isArray(p) || p.length !== 3 || !p.every((v) => typeof v === "number" && Number.isFinite(v))) {
              continue;
            }
            out.push({ actorId: entry.actorId, position: p });
          }
          return out;
        } catch {
          return null;
        }
      }

      window.__openClinXrProductLightingRigFns = {
        applyStationInteriorLightingForEnvironment,
        configureStationRendererToneMapping,
        loadLightingRig,
        loadProductRigCast,
      };
      bootIsolatedSubjectLab();
    </script>
  </body>
</html>
