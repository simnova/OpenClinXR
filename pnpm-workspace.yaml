packages:
  - "apps/api"
  - "apps/ui-admin"
  - "apps/ui-xr"
  - "apps/arena/*"
  - "packages/cellix/*"
  - "packages/openclinxr/*"
  - "packages/openclinxr/stations/*"
  - "packages/openclinxr-verification/*"
  - "packages/openclinxr/arena/*"

engineStrict: true

catalog:
  typescript: "6.0.3"
  vitest: "4.1.5"
  tsx: "4.21.0"
  vite: "8.1.6"
  three: "0.184.0"
  "@types/three": "0.184.0"
  mongodb: "7.2.0"
  mongodb-memory-server: "11.1.0"
  "@sinclair/typebox": "0.34.49"
  ajv: "8.20.0"
  antd: "6.3.7"
  graphql: "16.12.0"
  "@types/node": "25.6.0"
  "@typescript/native-preview": "7.0.0-dev.20260503.1"

overrides:
  brace-expansion: "5.0.12"
  minimatch@9>brace-expansion: "2.1.7"
  fast-uri: "3.1.8"
  form-data: "4.0.6"
  hono: "4.12.33"
  immutable: "5.1.8"
  ip-address: "10.3.1"
  js-yaml: "4.3.2"
  postcss: "8.5.18"
  protobufjs: "8.4.1"
  qs: "6.15.2"
  react-router: "8.3.0"
  rolldown: "1.0.0-rc.18"
  sharp: "0.35.5"
  shell-quote: "1.11.0"
  three: "0.184.0"
  undici: "7.30.1"
  "@graphql-tools/utils@11": "12.0.2"
  "@graphql-tools/utils@12": "12.0.2"
  "@fastify/busboy@3": "3.2.1"
  "@graphql-tools/executor-legacy-ws@1": "1.1.35"
  body-parser@2: "2.4.0"
  dompurify: "3.4.17"
  zod@4: "4.6.6"
  browserslist@4: "4.28.7"
  follow-redirects@1: "1.16.1"
  nanoid@3: "3.3.18"
  smol-toml@1: "1.7.1"
  source-map-js@1: "1.2.2"
  vite: "8.1.6"
  ws: "8.21.1"

# Emergency security exception: @gltf-transform/cli currently resolves tmp@0.2.7,
# which clears the high-severity tmp advisory before the normal maturity window.
minimumReleaseAgeExclude:
  - "tmp@0.2.7"
  - '@colyseus/schema@5.0.43'

allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  msgpackr-extract: false
  protobufjs: true
  sharp: true

# pnpm 11 auto-installs on script runs; concurrent auto-installs from parallel
# turbo workers kill each other with SIGINT. CI/dev run `pnpm install` explicitly.
verifyDepsBeforeRun: false

peerDependencyRules:
  allowedVersions:
    vite: "8.1.6"
