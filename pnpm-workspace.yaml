packages:
  - "apps/api"
  - "apps/ui-admin"
  - "apps/ui-xr"
  - "apps/arena/*"
  - "packages/cellix/*"
  - "packages/openclinxr/*"
  - "packages/openclinxr/arena/*"

catalog:
  typescript: "6.0.3"
  vitest: "4.1.5"
  tsx: "4.21.0"
  vite: "8.0.16"
  three: "0.184.0"
  "@types/three": "0.184.0"
  mongodb: "7.2.0"
  mongodb-memory-server: "11.1.0"
  "@sinclair/typebox": "0.34.49"
  ajv: "8.20.0"

overrides:
  brace-expansion: "5.0.9"
  minimatch@9>brace-expansion: "2.1.4"
  fast-uri: "3.1.4"
  form-data: "4.0.6"
  hono: "4.12.33"
  immutable: "5.1.8"
  ip-address: "10.1.1"
  js-yaml: "4.3.0"
  postcss: "8.5.18"
  protobufjs: "8.4.1"
  qs: "6.15.2"
  react-router: "8.3.0"
  rolldown: "1.0.0-rc.18"
  sharp: "0.35.0"
  shell-quote: "1.10.0"
  three: "0.184.0"
  undici: "7.28.0"
  vite: "8.0.16"
  ws: "8.21.1"

# Emergency security exception: @gltf-transform/cli currently resolves tmp@0.2.7,
# which clears the high-severity tmp advisory before the normal maturity window.
minimumReleaseAgeExclude:
  - "tmp@0.2.7"

allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  protobufjs: true
  sharp: true

# pnpm 11 auto-installs on script runs; concurrent auto-installs from parallel
# turbo workers kill each other with SIGINT. CI/dev run `pnpm install` explicitly.
verifyDepsBeforeRun: false

peerDependencyRules:
  allowedVersions:
    vite: "8.0.16"
