<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>motion-backend-bakeoff isolated harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { CCDIKSolver } from "three/addons/animation/CCDIKSolver.js";

      const ACTOR = "/apps/ui-xr/public/generated-humanoids/mpfb-clinical-nurse-adult.glb";

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1280, 1280);
      renderer.setPixelRatio(1);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
      const key = new THREE.DirectionalLight(0xffffff, 1.4);
      key.position.set(1.2, 2.2, 1.6);
      scene.add(key);

      const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 40);
      camera.position.set(0.15, 1.05, 2.6);
      camera.lookAt(0, 0.85, 0);

      let root = null;
      const restQuats = new Map();

      function bones() {
        const out = [];
        root.traverse((o) => {
          if (o.isBone) out.push(o);
        });
        return out;
      }

      function findBone(re) {
        return bones().find((b) => re.test(b.name));
      }

      function snapshotRest() {
        restQuats.clear();
        for (const b of bones()) restQuats.set(b.uuid, b.quaternion.clone());
      }

      function restoreRest() {
        for (const b of bones()) {
          const q = restQuats.get(b.uuid);
          if (q) b.quaternion.copy(q);
        }
      }

      function applySeated() {
        const thighL = findBone(/upperleg01L|thighL/i);
        const thighR = findBone(/upperleg01R|thighR/i);
        const shinL = findBone(/lowerleg01L|shinL/i);
        const shinR = findBone(/lowerleg01R|shinR/i);
        const d2r = (d) => (d * Math.PI) / 180;
        if (thighL) thighL.rotateX(d2r(-86));
        if (thighR) thighR.rotateX(d2r(-86));
        if (shinL) shinL.rotateX(d2r(48));
        if (shinR) shinR.rotateX(d2r(48));
      }

      function twoBoneToward(upper, lower, effector, target, iters) {
        for (let i = 0; i < iters; i += 1) {
          for (const bone of [lower, upper]) {
            const e = new THREE.Vector3();
            const t = target.clone();
            effector.getWorldPosition(e);
            const origin = new THREE.Vector3();
            bone.getWorldPosition(origin);
            const toE = e.clone().sub(origin).normalize();
            const toT = t.sub(origin).normalize();
            const q = new THREE.Quaternion().setFromUnitVectors(toE, toT);
            bone.quaternion.multiply(q);
            bone.updateMatrixWorld(true);
          }
        }
      }

      function bakedRockClutch() {
        const pelvis = findBone(/^pelvis$|pelvisL/i) ?? findBone(/spine01/i);
        const upper = findBone(/upperarm01R|upper_armR/i);
        const lower = findBone(/lowerarm01R|forearmR/i);
        if (pelvis) pelvis.rotateZ(0.28);
        if (upper) upper.rotateZ(-0.55);
        if (lower) lower.rotateY(-0.7);
      }

      function runtimeRockClutch() {
        const pelvis = findBone(/^pelvis$|pelvisL/i) ?? findBone(/spine01/i);
        if (pelvis) pelvis.rotateZ(Math.sin(1.2) * 0.22);
        const upper = findBone(/upperarm01R|upper_armR/i);
        const lower = findBone(/lowerarm01R|forearmR/i);
        const hand = findBone(/handR|wrist02R/i);
        const chest = findBone(/spine02|chest/i);
        if (upper && lower && hand && chest) {
          const target = new THREE.Vector3();
          chest.getWorldPosition(target);
          target.x += 0.08;
          target.y -= 0.12;
          twoBoneToward(upper, lower, hand, target, 10);
        }
      }

      function bakedPulse() {
        const upper = findBone(/upperarm01L|upper_armL/i);
        const lower = findBone(/lowerarm01L|forearmL/i);
        if (upper) {
          upper.rotateX(-0.4);
          upper.rotateZ(0.85);
        }
        if (lower) lower.rotateY(0.35);
      }

      function runtimePulse() {
        const upper = findBone(/upperarm01L|upper_armL/i);
        const lower = findBone(/lowerarm01L|forearmL/i);
        const hand = findBone(/handL|wrist02L/i);
        const chest = findBone(/spine02|chest/i);
        if (upper && lower && hand && chest) {
          const target = new THREE.Vector3();
          chest.getWorldPosition(target);
          target.x -= 0.35;
          target.y += 0.05;
          target.z += 0.28;
          twoBoneToward(upper, lower, hand, target, 10);
        }
      }

      window.renderPose = async ({ arm, behaviour }) => {
        if (!root) throw new Error("glb not loaded");
        restoreRest();
        applySeated();
        root.updateMatrixWorld(true);
        if (arm === "baked_tracks" && behaviour === "rock_plus_clutch") bakedRockClutch();
        if (arm === "runtime_goals" && behaviour === "rock_plus_clutch") runtimeRockClutch();
        if (arm === "baked_tracks" && behaviour === "pulse_presentation") bakedPulse();
        if (arm === "runtime_goals" && behaviour === "pulse_presentation") runtimePulse();
        root.updateMatrixWorld(true);
        renderer.render(scene, camera);
        return { bones: bones().length, arm, behaviour };
      };

      const gltf = await new GLTFLoader().loadAsync(ACTOR);
      root = gltf.scene;
      scene.add(root);
      snapshotRest();
      window.__bakeoffReady = true;

      // ---- runtime-goal arm: CCDIKSolver per-frame applier ----
      // Content-addressed descriptor + live targetWorld. The descriptor names the goals
      // (pelvis oscillator, hand-to-body-region contact); the target arrives AFTER it.
      const tmpV = new THREE.Vector3();
      const tmpQ = new THREE.Quaternion();
      let runtimeGoalState = null;

      // Role -> actor-bone resolution for THIS rig (mpfb-clinical-nurse-adult). The descriptor
      // survives an actor rebake because it names roles, not the baked bytes. GLTFLoader
      // sanitizes node names (three strips '.', so wrist.R loads as wristR), so lookups try
      // both the dotted (raw GLB) and sanitized (runtime) spellings.
      const ROLE_TO_BONE = {
        pelvis: "root", // pelvis center: parent of pelvisL/R and spine05 on this rig
        rightHand: "wristR",
        rightChestSurface: "breastR",
        chestSpineLine: "spine02",
      };

      function resolveBoneName(name) {
        const bonesList = bones();
        const hit = bonesList.find((b) => b.name === name);
        if (hit) return name;
        const sanitized = name.replace(/\s/g, "_").replace(/[^\w-]/g, "");
        const alt = bonesList.find((b) => b.name === sanitized);
        return alt ? sanitized : name;
      }

      async function initRuntimeGoal(descriptor) {
        const goals = Array.isArray(descriptor?.goals) ? descriptor.goals : [];
        const oscillator = goals.find((g) => g.kind === "oscillator");
        const contact = goals.find((g) => g.kind === "body_region_contact");
        if (!oscillator || !contact) throw new Error("descriptor lacks oscillator and body_region_contact goals");

        const boneByRole = (role) => {
          const literal = typeof role === "string" ? role : String(role);
          const mapped = ROLE_TO_BONE[literal] ?? literal;
          const runtimeName = resolveBoneName(mapped);
          const hit = bones().find((b) => b.name === runtimeName);
          if (!hit) throw new Error(`actor lacks bone ${runtimeName} for role ${role}`);
          return hit;
        };

        const skinned = (() => {
          let hit = null;
          root.traverse((o) => {
            if (o.isSkinnedMesh && !hit) hit = o;
          });
          return hit;
        })();
        if (!skinned) throw new Error("actor has no skinned mesh");
        const skeletonBones = skinned.skeleton.bones;

        // CCDIKSolver rotates `links` (each the parent of the one below it) until the effector's
        // world position reaches the target bone's world position. Links ascend from wrist to clavicle.
        const effector = boneByRole(contact.effectorRole ?? "rightHand");
        const chainNames = Array.isArray(contact.chainRoles) ? contact.chainRoles : [];
        const effIdx = skeletonBones.indexOf(effector);
        if (effIdx < 0) throw new Error("effector not in skinned skeleton");
        const linkIndices = chainNames.map((n) => {
          const i = skeletonBones.indexOf(boneByRole(n));
          if (i < 0) throw new Error(`chain bone ${n} not in skinned skeleton`);
          return i;
        });

        // Live target: a dedicated goal bone appended to a solver-local bones array so the
        // actor's skinning skeleton is never mutated. CCDIKSolver only reads target.matrixWorld.
        const goalBone = new THREE.Bone();
        goalBone.name = "__runtimeGoalTarget";
        root.add(goalBone);
        const solverBones = [...skeletonBones, goalBone];
        const ik = {
          target: solverBones.length - 1,
          effector: effIdx,
          links: linkIndices.map((index) => ({ index })),
          iteration: 200,
        };
        const solver = new CCDIKSolver({ skeleton: { bones: solverBones } }, [ik]);

        // Oscillator driver: the pelvis center. Translating it bobs the whole pelvis block in
        // world Y, which the eval records on the pelvis.L/R hip bones (children of root).
        const pelvisBone = boneByRole(oscillator.boneRole ?? "pelvis");
        const basePelvisPos = pelvisBone.position.clone();
        const pelvisParent = pelvisBone.parent;

        function placeGoal(worldPos) {
          const local = tmpV.copy(worldPos);
          if (goalBone.parent) {
            goalBone.parent.updateWorldMatrix(true, false);
            local.applyMatrix4(goalBone.parent.matrixWorld.clone().invert());
          }
          goalBone.position.copy(local);
        }

        function applyPelvisWorldDelta(delta) {
          pelvisBone.position.copy(basePelvisPos);
          if (pelvisParent) {
            pelvisParent.updateWorldMatrix(true, false);
            tmpQ.setFromRotationMatrix(pelvisParent.matrixWorld).invert();
            const local = tmpV.copy(delta).applyQuaternion(tmpQ);
            pelvisBone.position.add(local);
          } else {
            pelvisBone.position.add(delta);
          }
        }

        const recorder = [];
        for (const b of bones()) recorder.push(b);

        function snapshotBones() {
          // Order matters: the eval contract picks the FIRST key matching its bone regexes,
          // so the driven pelvis and the right-wrist effector must precede lookalikes (wrist.L).
          const preferred = ["pelvisL", "pelvisR", "wristR", effector.name, pelvisBone.name];
          const out = {};
          const emit = (b) => {
            if (Object.prototype.hasOwnProperty.call(out, b.name)) return;
            b.getWorldPosition(tmpV);
            out[b.name] = { x: tmpV.x, y: tmpV.y, z: tmpV.z };
          };
          for (const name of preferred) {
            const b = recorder.find((x) => x.name === name);
            if (b) emit(b);
          }
          for (const b of recorder) emit(b);
          return out;
        }

        return {
          pelvisBone,
          effector,
          solver,
          ik,
          applyPelvisWorldDelta,
          snapshotBones,
          placeGoal,
        };
      }

      window.__runtimeGoalEval = async () => {
        const descriptor = await (await fetch("runtime-goal-descriptor.json")).json();
        const state = runtimeGoalState ?? (runtimeGoalState = await initRuntimeGoal(descriptor));
        const goals = Array.isArray(descriptor?.goals) ? descriptor.goals : [];
        const oscillator = goals.find((g) => g.kind === "oscillator");
        const contact = goals.find((g) => g.kind === "body_region_contact");

        // Stage-2 pose: bind pose. Stage-3 (IK) resolves each frame against the live target.
        restoreRest();
        root.updateMatrixWorld(true);

        // Body-region anchor: right chest surface, taken from the actor at evaluation time.
        const anchor = bones().find((x) => x.name === ROLE_TO_BONE.rightChestSurface);
        if (!anchor) throw new Error("actor lacks breast.R chest anchor");
        const spine02 = bones().find((x) => x.name === ROLE_TO_BONE.chestSpineLine);
        anchor.getWorldPosition(tmpV);
        const anchorPos = tmpV.clone();
        if (spine02) {
          spine02.getWorldPosition(tmpV);
          tmpV.subVectors(anchorPos, tmpV).normalize();
        } else {
          tmpV.set(0, 0, 1);
        }
        const normal = tmpV.clone();

        // Reach limit lives in the TARGET: each goal target is a point a fixed outward distance
        // from the chest surface. The two evaluations differ ONLY in that outward distance.
        const reachLimit = contact.reachOutwardMeters ?? 0.12;
        const targetAWorld = anchorPos.clone().addScaledVector(normal, 0.03);
        const targetBWorld = anchorPos.clone().addScaledVector(normal, 0.03 + reachLimit);

        const solve = (phase, targetWorld) => {
          restoreRest();
          const amp = oscillator.amplitudeMeters ?? 0.03;
          state.applyPelvisWorldDelta(tmpV.set(0, amp * Math.sin(phase), 0));
          state.placeGoal(targetWorld);
          root.updateMatrixWorld(true);
          state.solver.updateOne(state.ik, 1);
          root.updateMatrixWorld(true);
          return {
            targetWorld: { x: targetWorld.x, y: targetWorld.y, z: targetWorld.z },
            bones: state.snapshotBones(),
            solverBlend: 1,
          };
        };

        const frames = oscillator.framesPerPeriod ?? 12;
        const oscillation = [];
        for (let k = 0; k < frames; k += 1) {
          oscillation.push(solve((2 * Math.PI * k) / frames, targetAWorld));
        }
        const targetA = solve(0, targetAWorld);
        const targetB = solve(0, targetBWorld);

        return {
          schemaVersion: "openclinxr.motion-backend-bakeoff.runtime-goal-eval.v1",
          solver: "CCDIKSolver",
          solverSource: "three/examples/jsm/animation/CCDIKSolver.js",
          oscillation,
          targetA,
          targetB,
        };
      };
    </script>
  </body>
</html>
